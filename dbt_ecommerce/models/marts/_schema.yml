version: 2

models:
  - name: dim_customers
    description: "Dimension khách hàng - grain: customer_unique_id"
    columns:
      - name: customer_sk
        tests: [ unique, not_null ]
      - name: customer_unique_id
        tests: [ unique, not_null ]

  - name: dim_products
    description: "Dimension sản phẩm"
    columns:
      - name: product_sk
        tests: [ unique, not_null ]
      - name: product_id
        tests: [ unique, not_null ]

  - name: dim_sellers
    description: "Dimension người bán"
    columns:
      - name: seller_sk
        tests: [ unique, not_null ]

  - name: dim_date
    description: "Date spine 2016-2019"
    columns:
      - name: date_day
        tests: [ unique, not_null ]

  - name: fct_orders
    description: "Fact đơn hàng - grain: order_id"
    columns:
      - name: order_sk
        description: "Khóa thay thế của đơn hàng, được tạo từ order_id."
        tests:
          - unique
          - not_null
      - name: order_id
        description: "Mã định danh đơn hàng."
        tests:
          - unique
          - not_null
      - name: customer_sk
        description: "Khóa thay thế của khách hàng, được tạo từ customer_unique_id để liên kết với dim_customers."
      - name: order_date
        description: "Ngày đặt hàng, lấy phần ngày từ thời điểm order_purchase_timestamp đã được ép kiểu về DATE."
      - name: order_status
        description: "Trạng thái hiện tại của đơn hàng."
        tests:
          - not_null
          - accepted_values:
              values:
                - approved
                - canceled
                - created
                - delivered
                - invoiced
                - processing
                - shipped
                - unavailable
      - name: approval_hours
        description: "Số giờ từ khi đặt hàng đến khi đơn hàng được phê duyệt, theo cách tính của model intermediate."
      - name: total_payment_value
        description: "Tổng giá trị thanh toán của đơn hàng."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
      - name: payment_count
        description: "Số bản ghi thanh toán được ghi nhận cho đơn hàng."
      - name: max_installments
        description: "Số kỳ trả góp lớn nhất được ghi nhận trong các khoản thanh toán của đơn hàng."
      - name: credit_card_value
        description: "Tổng giá trị thanh toán bằng thẻ tín dụng của đơn hàng."
      - name: boleto_value
        description: "Tổng giá trị thanh toán bằng boleto của đơn hàng."
      - name: voucher_value
        description: "Tổng giá trị thanh toán bằng voucher của đơn hàng."
      - name: debit_card_value
        description: "Tổng giá trị thanh toán bằng thẻ ghi nợ của đơn hàng."
      - name: item_count
        description: "Tổng số dòng sản phẩm trong đơn hàng."
      - name: distinct_product_count
        description: "Số sản phẩm khác nhau trong đơn hàng."
      - name: distinct_seller_count
        description: "Số người bán khác nhau có sản phẩm trong đơn hàng."
      - name: total_item_value
        description: "Tổng giá trị sản phẩm trong đơn hàng, theo phép tính của model intermediate."
      - name: total_freight_value
        description: "Tổng phí vận chuyển của các sản phẩm trong đơn hàng."
      - name: review_score
        tests:
          - dbt_utils.accepted_range:
              min_value: 1
              max_value: 5
        description: Số điểm đánh giá cho từng đơn hàng

  - name: fct_order_items
    description: "Fact chi tiết món hàng - grain: order_id + order_item_id"
    columns:
      - name: order_item_sk
        description: "Khóa thay thế của dòng sản phẩm, được tạo từ order_id và order_item_id."
        tests: [ unique, not_null ]
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('fct_orders')
              field: order_id
      - name: product_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_sk
      - name: seller_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_sellers')
              field: seller_sk
      - name: item_price
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
      - name: order_date
        description: "Ngày đặt hàng, lấy phần ngày từ thời điểm đặt hàng của đơn."
      - name: product_category_name
        description: "Tên danh mục sản phẩm theo ngôn ngữ gốc trong dữ liệu."
      - name: product_category_name_en
        description: "Tên danh mục sản phẩm bằng tiếng Anh."
      - name: seller_state
        description: "Mã bang hoặc tiểu bang nơi người bán đặt trụ sở."
